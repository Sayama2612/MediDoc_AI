<!DOCTYPE html>
<html>
<head>
    <title>Healthcare Document Processing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .result {
            white-space: pre-wrap;
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .loading {
            display: none;
            margin: 10px 0;
        }
        .flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .flex-item {
            flex: 1;
            min-width: 300px;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 5px;
        }
        .error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Healthcare Document Processing System</h1>
    </div>

    <div class="container">
        <h2>Upload Document</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.pdf,.txt">
            <button type="submit">Upload</button>
        </form>
        <div id="uploadLoading" class="loading">Processing...</div>
        <div id="uploadResult" class="result"></div>
    </div>

    <div class="flex-container">
        <div class="flex-item container">
            <h2>Document Classification</h2>
            <button onclick="classify()">Classify Document</button>
            <div id="classifyResult" class="result">No classification yet</div>
        </div>

        <div class="flex-item container">
            <h2>Named Entity Recognition</h2>
            <button onclick="extractEntities()">Extract Entities</button>
            <div id="nerResult" class="result">No entities extracted</div>
        </div>
    </div>

    <div class="flex-container">
        <div class="flex-item container">
            <h2>Document Summary</h2>
            <button onclick="generateSummary()">Generate Summary</button>
            <div id="summaryResult" class="result">No summary generated</div>
        </div>

        <div class="flex-item container">
            <h2>Anomaly Detection</h2>
            <button onclick="checkAnomalies()">Check for Anomalies</button>
            <div id="anomalyResult" class="result">No anomalies checked</div>
        </div>
    </div>

    <div class="container">
        <h2>Search Documents</h2>
        <input type="text" id="searchInput" placeholder="Search in documents...">
        <button onclick="searchDocs()">Search</button>
        <div id="searchResult" class="result">No search performed</div>
    </div>

    <script>
        let currentText = '';

        document.getElementById('uploadForm').onsubmit = async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a file first');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            document.getElementById('uploadLoading').style.display = 'block';
            document.getElementById('uploadResult').textContent = '';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.error) {
                    document.getElementById('uploadResult').textContent = 'Error: ' + data.error;
                } else {
                    currentText = data.text;
                    document.getElementById('uploadResult').textContent = data.text;
                }
            } catch (error) {
                document.getElementById('uploadResult').textContent = 'Error: ' + error.message;
            }
            document.getElementById('uploadLoading').style.display = 'none';
        };

        async function classify() {
            if (!currentText) {
                alert('Please upload a document first');
                return;
            }
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: currentText })
                });
                const data = await response.json();
                document.getElementById('classifyResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('classifyResult').textContent = 'Error: ' + error.message;
            }
        }

        async function extractEntities() {
            if (!currentText) {
                alert('Please upload a document first');
                return;
            }
            try {
                const response = await fetch('/ner', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: currentText })
                });
                const data = await response.json();
                document.getElementById('nerResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('nerResult').textContent = 'Error: ' + error.message;
            }
        }

        async function generateSummary() {
            if (!currentText) {
                alert('Please upload a document first');
                return;
            }
            try {
                const response = await fetch('/summarize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: currentText })
                });
                const data = await response.json();
                document.getElementById('summaryResult').textContent = data.summary;
            } catch (error) {
                document.getElementById('summaryResult').textContent = 'Error: ' + error.message;
            }
        }

        async function checkAnomalies() {
            if (!currentText) {
                alert('Please upload a document first');
                return;
            }
            try {
                const response = await fetch('/anomaly', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: currentText })
                });
                const data = await response.json();
                document.getElementById('anomalyResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('anomalyResult').textContent = 'Error: ' + error.message;
            }
        }

        async function searchDocs() {
            const query = document.getElementById('searchInput').value;
            if (!query) {
                alert('Please enter a search query');
                return;
            }
            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                document.getElementById('searchResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('searchResult').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
